services:
  - type: web
    name: learnhub-api
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email: Option A — Gmail SMTP with App Password (may be blocked on Render free tier)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Email: Option B — Resend API (RECOMMENDED for reliable production delivery)
      # Sign up free at https://resend.com, verify your domain, get an API key.
      # Set RESEND_API_KEY in the Render dashboard — the server will use Resend HTTPS
      # instead of Gmail SMTP, bypassing all outbound port blocks.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
