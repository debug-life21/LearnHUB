services:
  - type: web
    name: learnhub-api
    env: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: debuglife1221@gmail.com
      - key: SMTP_PASS
        value: iakgmhpfzlvyavcw
      - key: SMTP_FROM
        value: "TedbabeLearnHUB <debuglife1221@gmail.com>"
